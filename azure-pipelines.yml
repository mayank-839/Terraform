trigger: 
 branches:
   include:
     - main

pool: infra_agent

stages:
  - stage: 
    jobs:
      - job: 
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: 'environment/dev'
            backendServiceArm: 'infra_pippeline'
            backendAzureRmOverrideSubscriptionID: '15ecf76e-edd4-4aad-bd65-ff767992d273'
            backendAzureRmResourceGroupName: 'mayank-rg'
            backendAzureRmStorageAccountName: 'backendsa1'
            backendAzureRmContainerName: 'infracontainer'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: 'environment/dev'
            environmentServiceNameAzureRM: 'infra_pippeline'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: 'environment/dev'
            environmentServiceNameAzureRM: 'infra_pippeline'
